# -------------------------------------------------------------------------------------
# Output Formats Configuration
# See: https://gohugo.io/configuration/output-formats/
# -------------------------------------------------------------------------------------

# 用于输出 Markdown 格式文档的设置
[MarkDown]
mediaType = "text/markdown"
isPlainText = true
isHTML = false

# FixIt 0.3.0 | NEW 用于输出 /archives/index.html 文件的设置
[archives]
path = "archives"
baseName = "index"
mediaType = "text/html"
isPlainText = false
isHTML = true
permalinkable = true

# FixIt 0.3.0 | NEW 用于输出 /offline/index.html 文件的设置
[offline]
path = "offline"
baseName = "index"
mediaType = "text/html"
isPlainText = false
isHTML = true
permalinkable = true

# FixIt 0.3.0 | NEW 用于输出 readme.md 文件的设置
[README]
baseName = "readme"
mediaType = "text/markdown"
isPlainText = true
isHTML = false
