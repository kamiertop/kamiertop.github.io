[seo]
# cover image URL
cover = ""
# thumbnail URL
thumbnail_url = ""

# Analytics config
[analytics]
enable = true

# Google Analytics
[analytics.google]
id = ""
# whether to anonymize IP
anonymize_ip = true

# Fathom Analytics
[analytics.fathom]
id = ""
# server url for your tracker if you're self hosting
server = ""

# FixIt 0.3.16 | NEW Baidu Analytics
[analytics.baidu]
id = ""

# FixIt 0.3.16 | NEW Umami Analytics
[analytics.umami]
data_website_id = ""
src = ""
data_host_url = ""
data_domains = ""

# FixIt 0.3.16 | NEW Plausible Analytics
[analytics.plausible]
