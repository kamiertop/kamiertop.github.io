# -------------------------------------------------------------------------------------
# Theme Core Configuration
# See: https://fixit.lruihao.cn/documentation/basics/#theme-configuration
# -------------------------------------------------------------------------------------

# FixIt 0.2.15 | CHANGED FixIt theme version
version = "1.0.X" # e.g. "0.4.X", "0.4.5", "v1.0.0" etc.
# site description
description = ""
# site keywords
keywords = []
# site default theme ["light", "dark", "auto"]
default_theme = "auto"
# which hash function used for SRI, when empty, no SRI is used
# ["sha256", "sha384", "sha512", "md5"]
fingerprint = ""
# date format
date_format = "2006-01-02"
# website images for Open Graph and Twitter Cards
images = []
# FixIt 0.2.12 | NEW enable PWA
capitalize_titles = true
# FixIt 0.2.14 | NEW whether to add external Icon for external links automatically

# Collection sidebar and post-footer collection navigation.
collection_list = true

[link]
external_icon = true
# FixIt 0.3.0 | NEW whether to add site title to the title of every page
# remember to set up your site title in `hugo.toml` (e.g. title = "title")
with_site_title = true
# FixIt 0.3.0 | NEW title delimiter when the site title is be added to the title of every page
title_delimiter = "-"
# FixIt 0.3.0 | NEW whether to add site subtitle to the title of index page
# remember to set up your site subtitle by `params.header.subtitle.name`
index_with_subtitle = false
# FixIt 0.3.13 | NEW whether to show summary in plain text
summary_plainify = false
# FixIt 0.4.0 | NEW whether to enable merging missing translations from other languages
# when set to true, missing translations from other languages will be merged and displayed
# default is false for better performance, especially for single-language sites
# set to true if your site has multiple languages and you want to show all content
enable_translation_merge = false
# FixIt 0.4.4 | NEW whether to enable tooltip replacement for elements with title attribute, such as footnote references
tooltip = true
# FixIt 0.2.14 | NEW FixIt will, by default, inject a theme meta tag in the HTML head on the home page only.
# You can turn it off, but we would really appreciate if you don’t, as this is a good way to watch FixIt's popularity on the rise.
disable_theme_inject = false

# Appearance Configuration
# See: layouts/_partials/function/scss-vars.html in FixIt.
[appearance]
global_font_family = "system-ui, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei UI, Segoe UI, Roboto, Oxygen, Ubuntu, Cantarell, Fira Sans, Droid Sans, Helvetica Neue, Helvetica, Arial, 'Nerd Font Symbols Blog', sans-serif"
code_font_family = "Source Code Pro, Menlo, Consolas, Monaco, 'Nerd Font Symbols Blog', monospace"

# Author Configuration
[author]
  name = "kamiertop"
  email = "kamiertop@gmail.com"
  link = ""
  avatar = "/avatar.png"

# FixIt 0.3.0 | NEW public Git repository information only then enableGitInfo is true
[git_info]
# e.g. "https://github.com/hugo-fixit/docs"
repo = "https://github.com/kamiertop/kamiertop.github.io"
branch = "main"
# the content directory path relative to the root of the repository
dir = "content"
# the issue template for reporting issue of the posts
# available template params: {title} {URL} {sourceURL}
issue_tpl = "title=[BUG]%20{title}&body=|Field|Value|%0A|-|-|%0A|Title|{title}|%0A|URL|{URL}|%0A|Filename|{sourceURL}|"

# App icon config
[app]
# optional site title override for the app when added to an iOS home screen or Android launcher
name = "KamiertopのBlogSite"
pwa = false
# whether to omit favicon resource links
no_favicon = false
# modern SVG favicon to use in place of older style .png and .ico files
svg_favicon = ""
# Safari mask icon color
mask_color = "#5bbad5"
# Windows v8-10 tile color
tile_color = "#da532c"

# FixIt 0.2.12 | CHANGED Android browser theme color
[app.theme_color]
light = "#f8f8f8"
dark = "#252627"

# Search config
[search]
enable = true
# type of search engine ["algolia", "fuse", "cse", "post-chat"]
type = "fuse"
# max index length of the chunked content
content_length = 4000
# placeholder of the search bar
placeholder = ""
# max number of results length
max_result_length = 10
# snippet length of the result
snippet_length = 30
# HTML tag name of the highlight part in results
highlight_tag = "em"
# whether to use the absolute URL based on the baseURL in search index
absolute_url = false
# FixIt 0.4.0 | NEW whether to enable anchorify for headings in search results
anchorify = true

[search.algolia]
index = ""
app_id = ""
search_key = ""

# FixIt 0.2.17 | NEW https://fusejs.io/api/options.html
[search.fuse]
is_case_sensitive = false
min_match_char_length = 2
find_all_matches = false
location = 0
threshold = 0.3
distance = 100
ignore_location = false
use_extended_search = false
ignore_field_norm = false

# FixIt 0.3.16 | NEW Custom Search Engine (CSE)
[cse]
# Search Engine: ["google", "bing"]
engine = ""
# Search results page URL (layout: search)
results_page = "/search/"

# Google: https://programmablesearchengine.google.com/
# Google Custom Search Engine Context
[cse.google]
cx = ""

# Bing (Unsupported): https://www.customsearch.ai/
[cse.bing]

# Header config
[header]
# FixIt 0.2.13 | CHANGED desktop header mode ["sticky", "normal", "auto"]
desktop_mode = "sticky"
# FixIt 0.2.13 | CHANGED mobile header mode ["sticky", "normal", "auto"]
mobile_mode = "auto"

# Header title config
[header.title]
# URL of the LOGO
logo = ""
# title name
name = ""
# you can add extra information before the name (HTML format is supported), such as icons
pre = ""
# you can add extra information after the name (HTML format is supported), such as icons
post = ""
# whether to use typeit animation for title name
typeit = false

# FixIt 0.2.12 | NEW Header subtitle config
[header.subtitle]
# subtitle name
name = ""
# whether to use typeit animation for subtitle name
typeit = false

# FixIt 0.2.18 | NEW Breadcrumb config
[breadcrumb]
enable = true
sticky = false
show_home = true
# FixIt 0.3.13 | NEW
separator = "/"
capitalize = false

# FixIt 0.3.10 | NEW Post navigation config
[navigation]
# whether to show the post navigation in section pages scope
in_section = false
# whether to reverse the next/previous post navigation order
reverse = false

# Footer config
[footer]
enable = true
# whether to show copyright info
copyright = true
# whether to show the author
author = true
# Site creation year
since = 2021
# FixIt 0.2.12 | NEW Public network security only in China (HTML format is supported)
gov = ""
# ICP info only in China (HTML format is supported)
icp = ""
# license info (HTML format is supported)
license = '<a rel="license external nofollow noopener noreferrer" href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank">CC BY-NC-SA 4.0</a>'

# FixIt 0.3.0 | NEW whether to show Hugo and theme info
[footer.powered]
enable = true
hugo_logo = true
theme_logo = true

# FixIt 0.2.17 | CHANGED Site creation time
[footer.site_time]
enable = false
animate = true
icon = "fa-solid fa-heartbeat"
pre = ""
value = ""
# e.g. "2021-12-18T16:15:22+08:00"

# FixIt 0.2.17 | NEW footer lines order, optional values: ["first", 0, 1, 2, 3, 4, 5, "last"]
[footer.order]
powered = 0
copyright = 0
statistics = 0
visitor = 0
beian = 0

# FixIt 0.3.0 | NEW Archives page config (all pages of posts type)
[archives]
# special amount of posts in archives page
paginate = 20
# date format (month and day)
date_format = "01-02"

# Section page config (all pages in section)
[section]
# special amount of pages in each section page
paginate = 20
# date format (month and day)
date_format = "01-02"

# FixIt 0.3.10 | NEW Section feed config for RSS, Atom and JSON feed.
[section.feed]
# The number of posts to include in the feed. If set to -1, all posts.
limit = -1
# whether to show the full text content in feed.
full_text = false

# Term list (category or tag) page config
[list]
# special amount of posts in each list page
paginate = 20
# date format (month and day)
date_format = "01-02"

# FixIt 0.3.10 | NEW Term list feed config for RSS, Atom and JSON feed.
[list.feed]
# The number of posts to include in the feed. If set to -1, all posts.
limit = -1
# whether to show the full text content in feed.
full_text = false

# FixIt 0.3.13 | NEW recently updated pages config for archives, section and term list
[recently_updated]
archives = true
section = false
list = true
days = 30
max_count = 10

# FixIt 0.2.17 | NEW TagCloud config for tags page
[tag_cloud]
enable = true
min = 14 # Minimum font size in px
max = 32 # Maximum font size in px
peak_count = 10 # Maximum count of posts per tag
orderby = "name" # Order of tags, optional values: ["name", "count"]

# Home page config
[home]

# Home page profile
[home.profile]
enable = true
# FixIt 0.4.0 | NEW Whether to show profile and content only in the first home page
only_first_page = false
# Gravatar Email for preferred avatar in home page
gravatar_email = ""
# URL of avatar shown in home page, default is author's avatar
avatar_url = "/avatar.png"
# FixIt 0.2.17 | NEW identifier of avatar menu link
avatar_menu = ""
# title shown in home page (HTML format is supported)
title = "欢迎大家"
# subtitle shown in home page (HTML format is supported)
subtitle = ""
# whether to use typeit animation for subtitle
typeit = true
# whether to show social links
social = true
# disclaimer (HTML format is supported)
disclaimer = ""

# Home page posts
[home.posts]
enable = true
# special amount of posts in each home posts page
paginate = 10

