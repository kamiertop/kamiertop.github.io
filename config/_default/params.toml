typing_animate = true
beginning_text = ""
loading_text = true

# FixIt 0.4.0 | NEW Podcast AI config
# See https://ai.zhheo.com/docs/podcast.html
[podcast]
enable = false

# FixIt 0.3.10 | NEW Global Feed config for RSS, Atom and JSON feed.
[feed]
# The number of posts to include in the feed. If set to -1, all posts.
limit = 10
# whether to show the full text content in feed.
full_text = true

# Site Challenge for Follow: https://follow.is/
[feed.follow]
feed_id = ""
user_id = ""

# FixIt 0.3.17 | NEW Image config
# Combined with Hugo's image processing option `imaging` for image optimisation
[image]
# cache remote images for better optimisations
cache_remote = false
# Image resizing and optimisation (may slow builds)
optimise = false
# FixIt 0.4.0 | NEW A list of image file names or patterns to exclude from optimisation
# e.g. ["no-optimize.jpg", "*.tiff", "images/exclude-*.webp"]
black_list = []

# FixIt 0.4.0 | NEW Code block wrapper config
# you can override the global config via Markdown attributes, for example:
# ```lang {mode="mac", max_shown_lines=5}
# code here
# ```
[codeblock]
# 开启代码块包裹器，默认开启
wrapper = true
# code block mode
# available modes: ["classic", "mac", "simple", ...]
# if you set to custom value, you need to create a custom CSS for data-mode attribute
mode = "classic"
# additional classes for the code block wrapper
# e.g. "is-collapsed is-expanded line-nos-hidden line-wrapping"
wrapper_class = ""
# 最大显示行数，超过该行数的代码块将会被折叠，用户可以点击展开查看更多
max_shown_lines = 20
# whether to show shadow effect for code blocks, available values: ["always", "hover", "never"]
shadow = "always"
# 是否可以复制代码块内容，默认开启
copyable = true
# [classic] whether to enable code download button in the code block header
downloadable = false
# [classic] whether to enable code fullscreen button in the code block header
fullscreen = true
# [classic] 是否在代码块头部启用行号切换按钮
line_nos_toggler = true
# [classic] 是否在代码块头部启用切换自动换行按钮
line_wrap_toggler = true
# [classic][Experimental] whether to enable code edit button in the code block header
editable = true

# FixIt 0.4.0 | NEW JSON Viewer config
# See https://github.com/Lruihao/json-viewer-element
[json_viewer]
enable = true
expand_depth = 1
copyable = true
sort = false
boxed = true

# FixIt 0.4.2 | NEW File tree config
# See https://fixit.lruihao.cn/documentation/content-management/shortcodes/extended/file-tree/
[filetree]
# the expand level of the tree (expand all: -1, collapse all: 0)
level = 1
# whether to append a trailing "/" to folder names
folder_slash = false
# list of file or folder names to ignore
ignore_list = []

# FixIt 0.4.5 | NEW Print config
[print]
# whether to expand all admonitions before printing
expand_admonition = true
# whether to expand all code blocks and code tabs before printing
expand_code = true
# whether to expand all details elements before printing
expand_details = true
# whether to expand all file trees before printing
expand_file_tree = false

# Page-level default configurations (flattened from [page] in v1.0.0).
author_avatar = true
hidden_from_home_page = false
hidden_from_search = false
hidden_from_related = false
hidden_from_feed = false
twemoji = true
lightgallery = false
ruby = true
fraction = true
fontawesome = true
page_style = "normal"
auto_bookmark = false
show_lastmod = true
word_count = true
reading_time = true
end_flag = ""
instant_page = false
title_case_style = "ap"
license = '<a rel="license external nofollow noopener noreferrer" href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank">CC BY-NC-SA 4.0</a>'

# Post link config (v1.0.0+)
[post_link]
markdown = false
source = true
edit = false
report = false
editor = "vscode"

# Repost config
[repost]
enable = false
url = ""

# Expiration reminder config
[expiration_reminder]
enable = false
reminder = 90
warning = 180
close_comment = false

# Heading config
[heading]
capitalize = false

[heading.number]
enable = false
only_main_section = true

[heading.number.format]
h1 = "{title}"
h2 = "{h2} {title}"
h3 = "{h2}.{h3} {title}"
h4 = "{h2}.{h3}.{h4} {title}"
h5 = "{h2}.{h3}.{h4}.{h5} {title}"
h6 = "{h2}.{h3}.{h4}.{h5}.{h6} {title}"

# Mapbox GL JS config
[mapbox]
access_token = ""
light_style = "mapbox://styles/mapbox/light-v11"
dark_style = "mapbox://styles/mapbox/dark-v11"
navigation = true
geolocate = true
scale = true
fullscreen = true

# Reward (Sponsor) settings
[reward]
enable = false
animation = false
position = "after"
mode = "static"

[reward.ways]
# wechatpay = "/images/wechatpay.png"
# alipay = "/images/alipay.png"
# paypal = "/images/paypal.png"
# bitcoin = "/images/bitcoin.png"

# Third-party library config
[library]

[library.css]

[library.js]
# someJavascript = "some.js"

# Global page feature defaults used by FixIt v0.4.6+.
[toc]
enable = true
keep_static = false
auto = true
position = "right"
ordered = false
start_level = 2
end_level = 6
decrease_h1 = false

[math]
enable = true
type = "mathjax"
error_color = "#ff4949"

[math.katex]
copy_tex = true
throw_on_error = false
error_color = "#ff4949"

[math.katex.macros]
# "\\f" = "#1f(#2)" # usage: $\f{a}{b}$

[math.mathjax]
cdn = "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"

[math.mathjax.packages]
# "[+]" = ["configmacros"]

[math.mathjax.macros]
# bold = ["{\\bf #1}", 1] # usage: $\bold{math}$

[math.mathjax.loader]
load = [ "ui/safe" ]

[math.mathjax.loader.paths]
# custom = "https://cdn.jsdelivr.net/gh/sonoisa/XyJax-v3@3.0.1/build/"

[math.mathjax.options]
enable_menu = true
skip_html_tags = [
  "script",
  "noscript",
  "style",
  "textarea",
  "pre",
  "code",
  "math",
  "select",
  "option",
  "mjx-container"
]
ignore_html_class = "mathjax_ignore"

[math.mathjax.options.include_html_tags]
# "#comment" = ""
# br = "\n"
# wbr = ""

[related]
enable = false
count = 5
position = [ "aside" ]

[share]
enable = false
Twitter = true
Facebook = true
Linkedin = false
Whatsapp = false
Pinterest = false
Tumblr = false
HackerNews = false
Reddit = false
VK = false
Buffer = false
Xing = false
Line = false
Instapaper = false
Pocket = false
Flipboard = false
Weibo = true
Myspace = false
Blogger = false
Baidu = false
Odnoklassniki = false
Evernote = false
Skype = false
Trello = false
Mix = false

# FixIt v0.4.6+ reads comment settings from the top-level params.comment table.
[comment]
enable = true

[comment.utterances]
enable = true
# owner/repo
repo = "kamiertop/kamiertop.github.io"
issue_term = "pathname"
label = "comment"
light_theme = "github-light"
dark_theme = "github-dark"

# FixIt 0.3.12 | NEW Custom partials config
# Custom partials must be stored in the /layouts/_partials/ directory.
# Depends on open custom blocks https://fixit.lruihao.cn/references/blocks/
[custom_partials]
head = []
menu_desktop = []
menu_mobile = []
profile = []
aside = []
comment = []
footer = []
widgets = []
assets = []
post_toc_before = []
post_toc_after = []
post_content_before = []
post_content_after = []
post_footer_before = []
post_footer_after = []

# FixIt 0.2.15 | NEW Developer options
# Select the scope named `public_repo` to generate personal access token,
# Configure with environment variable `HUGO_PARAMS_GHTOKEN=xxx`, see https://gohugo.io/functions/os/getenv/#examples
[dev]
enable = false
# Check for updates
c4u = false
# FixIt 0.4.0 | NEW Enable debug mode
debug = false
